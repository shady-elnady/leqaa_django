{% load i18n static %}
<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
{% get_current_language_bidi as LANGUAGE_BIDI %}
<html lang="{{ LANGUAGE_CODE|default:'en-us' }}" dir="{{ LANGUAGE_BIDI|yesno:'rtl,ltr,auto' }}">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="5.0; url={% url 'event_master:Home' %}">
  <title>Cook - Splash page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700" />
  <link rel="stylesheet" href="{% static 'event_master/assets/css/splash.css' %}" />
</head>

<body>
  <!-- partial:index.partial.html -->
  <div class="splash">
    <div class="splash_logo">
      {% translate 'Wasla' %}
    </div>
    <div class="splash_svg">
      <svg width="100%" height="100%">
        <rect width="100%" height="100%">
      </svg>
    </div>
    <div class="splash_minimize">
      <svg width="100%" height="100%">
        <rect width="100%" height="100%">
      </svg>
    </div>
  </div>
  <div class="text">
    <img src="{% static 'event_master/assets/img/logo/logo_1x.png' %}" alt="logo"/>
  </div>
  <!-- partial -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.0.0/jquery.min.js"></script>
</body>

</html>
