{% load i18n %}
{% load static %}
{% load app_locales %}

<link rel="stylesheet" href="{% static 'css/locale.css' %}" />

<div class="dropdown" tab-index="0">  
  <button id="dropdown-btn"></button>
  <ul class="dropdown-content" id="dropdown-content"></ul>
  <script type="text/javascript">
    const dropdownBtn = document.getElementById("dropdown-btn");
    const dropdownContent = document.getElementById("dropdown-content");
    window.locales = [];

    {% for appLocale in app_locales %}
      window.locales.push({
        "language_name": `{{ appLocale.language_name }}`,
        "language_code": `{{ appLocale.language_code }}`,
        "language_is_bidir": `{{ appLocale.language_is_bidir }}`,
        "locale_code": `{{ appLocale.locale_code }}`,
        "locale_flag": getFlagSrc("US", `{{ appLocale.locale_flag }}`),
      });        
      {% endfor %}
      setSelectedLocale(
        window.locales.find(
          locale => locale.locale_code.toLowerCase() === `{{ LANGUAGE_CODE }}`.toLowerCase(),
          ),
      );

    function getFlagSrc(countryCode, flagURL) {
      return flagURL ? flagURL : (/^[A-Z]{2}$/.test(countryCode)
        ? `https://flagsapi.com/${countryCode.toUpperCase()}/shiny/64.png`
        : "");
    }

    function setSelectedLocale(appLocale) {
      let langName, flagURL;

      if(!appLocale.language_name){
        const intlLocale = new Intl.Locale(appLocale.locale_code);
        langName = new Intl.DisplayNames([appLocale.locale_code], {
          type: "language",
        }).of(intlLocale.language);
      }else{
        langName = appLocale.language_name;
      }

      flagURL = getFlagSrc(appLocale.locale_code.split('-')[1], appLocale.locale_flag);

      dropdownContent.innerHTML = "";
  

      const otherLocales = window.locales.filter((loc) => loc !== appLocale);
      otherLocales.forEach((otherAppLocale) => {
        let otherLangName, otherFlagURL;
      
        if(!appLocale.language_name){
          const otherIntlLocale = new Intl.Locale(otherAppLocale.locale_code);
          otherLangName = new Intl.DisplayNames([otherAppLocale.locale_code], {
            type: "language",
          }).of(otherIntlLocale.language);
        }else{
          otherLangName = otherAppLocale.language_name;
        }
        
        otherFlagURL = getFlagSrc(otherAppLocale.locale_code.split('-')[1], otherAppLocale.locale_flag);
      
        const listEl = document.createElement("li");
        listEl.innerHTML = `${otherLangName}<img src="${otherFlagURL}" />`;
        listEl.setAttribute("value", otherAppLocale.locale_code);
        listEl.setAttribute("name", "language");
        listEl.addEventListener("mousedown", function () {
          setSelectedLocale(otherAppLocale);
          
          let location = window.location;
          location.pathname = location.pathname.replace(location.pathname.split('/')[1], otherAppLocale.locale_code.replace('_', '-').toLowerCase());
        });
        dropdownContent.appendChild(listEl);
      });

      let imgFlag = '<';
      dropdownBtn.innerHTML = `${imgFlag}img src="${flagURL}" alt="${langName}" /> ${langName} <span class="arrow-down"></span>`;
    }
  </script>
</div>
