{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6; /* bg-gray-100 */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      
      .container {
        width: 100%;
        max-width: 1200px; /* Increased max-width */
        height: 100%;
        max-height: 800px; /* Added max-height */
        display: flex;
        flex-direction: column;
        background-color: #ffffff; /* bg-white */
        border-radius: 0.5rem; /* rounded-lg */
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1); /* shadow-md */
        overflow: hidden; /* Ensure rounded corners apply to inner elements */
      }
      
      /* Left Sidebar Styles */
      .left-sidebar {
        width: 30%;
        border-right: 1px solid #e5e7eb; /* border-r border-gray-200 */
        display: flex;
        flex-direction: column;
      }
      
      .left-sidebar .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem; /* p-4 */
        border-bottom: 1px solid #e5e7eb; /* border-b border-gray-200 */
      }
      
      .left-sidebar .header .user-info {
        display: flex;
        align-items: center;
      }
      
      .left-sidebar .header .avatar {
        width: 40px; /* w-10 */
        height: 40px; /* h-10 */
        border-radius: 9999px; /* rounded-full */
        margin-right: 0.75rem; /* mr-3 */
        background-color: #gray-400;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1rem;
      }
      
      .left-sidebar .header .header-actions {
        display: flex;
      }
      
      .left-sidebar .header .header-actions button {
        margin-left: 0.5rem; /* ml-2 */
        padding: 0.5rem 1rem; /* px-4 py-2 */
        border-radius: 0.375rem; /* rounded-md */
        border: 1px solid #d1d5db; /* border border-gray-300 */
        background-color: #f9fafb; /* bg-gray-50 */
        color: #1f2937; /* text-gray-800 */
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      
      .left-sidebar .header .header-actions button:hover {
        background-color: #f3f4f6; /* hover:bg-gray-100 */
      }
      
      .left-sidebar .search-bar {
        display: flex;
        padding: 1rem; /* p-4 */
        border-bottom: 1px solid #e5e7eb; /* border-b border-gray-200 */
      }
      
      .left-sidebar .search-bar input {
        flex-grow: 1;
        padding: 0.75rem; /* py-3 px-4 */
        border-radius: 0.375rem; /* rounded-md */
        border: 1px solid #d1d5db; /* border border-gray-300 */
        margin-right: 0.75rem; /* mr-3 */
        font-size: 0.875rem; /* text-sm */
      }
      
      .left-sidebar .search-bar button {
        padding: 0.75rem 1rem; /* py-3 px-4 */
        border-radius: 0.375rem; /* rounded-md */
        background-color: #6b7280; /* bg-gray-500 */
        color: #ffffff; /* text-white */
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      
      .left-sidebar .search-bar button:hover {
        background-color: #4b5563; /* hover:bg-gray-600 */
      }
      
      .left-sidebar .chat-filters {
        display: flex;
        padding: 1rem; /* p-4 */
        border-bottom: 1px solid #e5e7eb; /* border-b border-gray-200 */
      }
      
      .left-sidebar .chat-filters button {
        padding: 0.5rem 1rem; /* py-2 px-4 */
        border-radius: 0.375rem; /* rounded-md */
        margin-right: 0.5rem; /* mr-2 */
        border: none;
        background-color: transparent;
        color: #6b7280; /* text-gray-500 */
        cursor: pointer;
        transition: color 0.3s ease;
      }
      
      .left-sidebar .chat-filters button:hover {
        color: #374151; /* hover:text-gray-700 */
      }
      
      .left-sidebar .chat-filters button.active {
        color: #ffffff;
        background-color: #007bff;
      }
      
      .left-sidebar .chat-list {
        flex-grow: 1;
        overflow-y: auto;
      }
      
      .left-sidebar .chat-list .chat-item {
        display: flex;
        align-items: center;
        padding: 1rem; /* p-4 */
        border-bottom: 1px solid #f3f4f6; /* border-b border-gray-100 */
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      
      .left-sidebar .chat-list .chat-item:hover {
        background-color: #f9fafb; /* hover:bg-gray-50 */
      }
      
      .left-sidebar .chat-list .chat-item .avatar {
        width: 50px; /* w-12 */
        height: 50px; /* h-12 */
        border-radius: 9999px; /* rounded-full */
        margin-right: 1rem; /* mr-4 */
        background-color: #a0aec0;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.25rem;
      }
      
      .left-sidebar .chat-list .chat-item .chat-item-content {
        flex-grow: 1;
      }
      
      .left-sidebar .chat-list .chat-item .chat-item-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.25rem; /* mb-1 */
      }
      
      .left-sidebar .chat-list .chat-item .chat-item-header span {
        font-weight: 600; /* font-semibold */
        color: #1f2937; /* text-gray-800 */
      }
      
      .left-sidebar .chat-list .chat-item .chat-item-header small {
        color: #6b7280; /* text-gray-500 */
      }
      
      .left-sidebar .chat-list .chat-item .chat-item-last-message {
        color: #6b7280; /* text-gray-500 */
        font-size: 0.875rem; /* text-sm */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 200px;
      }
      
      /* Right Chat Panel Styles */
      .right-panel {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      
      .right-panel .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem; /* p-4 */
        border-bottom: 1px solid #e5e7eb; /* border-b border-gray-200 */
      }
      
      .right-panel .chat-header .user-info {
        display: flex;
        align-items: center;
      }
      
      .right-panel .chat-header .avatar {
        width: 40px; /* w-10 */
        height: 40px; /* h-10 */
        border-radius: 9999px; /* rounded-full */
        margin-right: 0.75rem; /* mr-3 */
        background-color: #007bff;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1rem;
      }
      
      .right-panel .chat-header span {
        font-weight: 600; /* font-semibold */
        color: #1f2937; /* text-gray-800 */
      }
      
      .right-panel .chat-header .header-actions button {
        margin-left: 0.5rem; /* ml-2 */
        padding: 0.5rem 1rem; /* px-4 py-2 */
        border-radius: 0.375rem; /* rounded-md */
        border: 1px solid #d1d5db; /* border border-gray-300 */
        background-color: #f9fafb; /* bg-gray-50 */
        color: #1f2937; /* text-gray-800 */
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      
      .right-panel .chat-header .header-actions button:hover {
        background-color: #f3f4f6; /* hover:bg-gray-100 */
      }
      
      .right-panel .chat-messages {
        flex-grow: 1;
        overflow-y: auto;
        padding: 1rem; /* p-4 */
        display: flex;
        flex-direction: column;
      }
      
      .right-panel .chat-messages .message {
        padding: 0.75rem 1rem; /* py-3 px-4 */
        margin-bottom: 0.5rem; /* mb-2 */
        border-radius: 0.375rem; /* rounded-md */
        max-width: 80%; /* Limit message width */
        clear: both; /* Clear float to handle message alignment */
      }
      
      .right-panel .chat-messages .message.sent {
        background-color: #dcf8c6; /* bg-green-100 */
        color: #15803d; /* text-green-800 */
        align-self: flex-end; /* self-end */
        text-align: right;
      }
      
      .right-panel .chat-messages .message.received {
        background-color: #eff6ff; /* bg-blue-100 */
        color: #1e40af; /* text-blue-800 */
        align-self: flex-start; /* self-start */
        text-align: left;
      }
      
      .right-panel .chat-messages .message .sender {
        display: block;
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 0.25rem;
      }
      
      .right-panel .message-input-area {
        display: flex;
        align-items: center;
        padding: 1rem; /* p-4 */
        border-top: 1px solid #e5e7eb; /* border-t border-gray-200 */
      }
      
      .right-panel .message-input-area input {
        flex-grow: 1;
        padding: 0.75rem; /* py-3 px-4 */
        border-radius: 0.375rem; /* rounded-md */
        border: 1px solid #d1d5db; /* border border-gray-300 */
        margin-right: 0.75rem; /* mr-3 */
        font-size: 0.875rem; /* text-sm */
      }
      
      .right-panel .message-input-area button {
        padding: 0.75rem 1rem; /* py-3 px-4 */
        border-radius: 0.375rem; /* rounded-md */
        background-color: #007bff; /* bg-blue-500 */
        color: #ffffff; /* text-white */
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      
      .right-panel .message-input-area button:hover {
        background-color: #0056b3; /* hover:bg-blue-700 */
      }
      
      /* Scrollbar Styles */
      .chat-messages::-webkit-scrollbar {
        width: 8px; /* width of the entire scrollbar */
      }
      
      .chat-messages::-webkit-scrollbar-track {
        background: #f1f3f5; /* track color */
        border-radius: 20px;
      }
      
      .chat-messages::-webkit-scrollbar-thumb {
        background-color: #cbd5e0; /* thumb color */
        border-radius: 20px; /* rounded corners of the thumb */
        border: 2px solid transparent; /* creates padding around the thumb */
        background-clip: content-box;
      }
      
      .chat-messages::-webkit-scrollbar-thumb:hover {
        background-color: #9ca3af; /* hover effect */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left-sidebar">
        <div class="header">
          <div class="user-info">
            <div class="avatar">+201061965771</div>
            <span>+20 10 61965771</span>
          </div>
          <div class="header-actions">
            <button>+</button>
            <button>...</button>
          </div>
        </div>
        <div class="search-bar">
          <input type="text" placeholder="Search..." />
          <button>Q</button>
        </div>
        <div class="chat-filters">
          <button class="active">All</button>
          <button>Unread</button>
          <button>Favorites</button>
          <button>Groups</button>
        </div>
        <div class="chat-list" id="chat-list"></div>
      </div>
      <div class="right-panel">
        <div class="chat-header">
          <div class="user-info">
            <div class="avatar">+201061965771</div>
            <span>+20 10 61965771</span>
          </div>
          <div class="header-actions">
            <button>...</button>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="message-input-area">
          <input type="text" id="message-input" placeholder="Type a message..." />
          <button id="send-button">+</button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Initialize Firebase
        const firebaseConfig = JSON.parse('{{ firebase_config|escapejs }}')
        firebase.initializeApp(firebaseConfig)
        const database = firebase.database()
        const messagesRef = database.ref('messages') // Changed to the root of messages
        const chatListRef = database.ref('users/user_1/chats') //Ref for the chats of the user.
        const userId = 'user_1' //  Replace with actual user ID.  Hardcoded for now.
      
        const messageInput = document.getElementById('message-input')
        const sendButton = document.getElementById('send-button')
        const chatMessagesDiv = document.getElementById('chat-messages')
        const chatListDiv = document.getElementById('chat-list')
      
        let currentChatId = null // To store the currently selected chat
      
        // Function to send a message
        function sendMessage() {
          const messageText = messageInput.value.trim()
          if (messageText && currentChatId) {
            const newMessageRef = messagesRef.child(currentChatId).push() // Use currentChatId
            const newMessage = {
              sender_uid: userId,
              text: messageText,
              timestamp: firebase.database.ServerValue.TIMESTAMP
            }
            newMessageRef
              .set(newMessage)
              .then(() => {
                messageInput.value = ''
              })
              .catch((error) => {
                console.error('Error sending message:', error)
              })
          }
        }
      
        // Event listener for the send button
        sendButton.addEventListener('click', sendMessage)
        messageInput.addEventListener('keypress', (event) => {
          if (event.key === 'Enter') {
            sendMessage()
          }
        })
      
        function displayMessage(message, isSent) {
          const messageDiv = document.createElement('div')
          messageDiv.classList.add('message')
          messageDiv.classList.add(isSent ? 'sent' : 'received')
      
          // Add sender name only if it's not the current user
          if (!isSent) {
            const senderSpan = document.createElement('span')
            senderSpan.classList.add('sender')
            senderSpan.textContent = 'Other User: ' //  Replace with actual sender name
            messageDiv.appendChild(senderSpan)
          }
      
          messageDiv.textContent += message.text
          chatMessagesDiv.appendChild(messageDiv)
          chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight
        }
      
        function loadChatMessages(chatId) {
          chatMessagesDiv.innerHTML = '' // Clear previous messages
          currentChatId = chatId // Set the current chat ID
      
          const chatMessagesRef = messagesRef.child(chatId)
          chatMessagesRef.orderByChild('timestamp').on('child_added', (snapshot) => {
            const message = snapshot.val()
            const isSent = message.sender_uid === userId
            displayMessage(message, isSent)
          })
        }
      
        function createChatItem(chatId, lastMessage) {
          const chatItemDiv = document.createElement('div')
          chatItemDiv.classList.add('chat-item')
          chatItemDiv.dataset.chatId = chatId
      
          const avatarDiv = document.createElement('div')
          avatarDiv.classList.add('avatar')
          avatarDiv.textContent = '+2010' // Replace with first characters of other user's phone
      
          const chatItemContentDiv = document.createElement('div')
          chatItemContentDiv.classList.add('chat-item-content')
      
          const chatItemHeaderDiv = document.createElement('div')
          chatItemHeaderDiv.classList.add('chat-item-header')
          const contactNameSpan = document.createElement('span')
          contactNameSpan.textContent = `+2010${chatId.slice(-4)}` //  Replace with contact name
          const lastMessageTime = document.createElement('small')
          lastMessageTime.textContent = lastMessage ? new Date(lastMessage.timestamp).toLocaleTimeString() : ''
          chatItemHeaderDiv.appendChild(contactNameSpan)
          chatItemHeaderDiv.appendChild(lastMessageTime)
      
          const chatItemLastMessageP = document.createElement('p')
          chatItemLastMessageP.classList.add('chat-item-last-message')
          chatItemLastMessageP.textContent = lastMessage ? lastMessage.text : 'No messages yet'
      
          chatItemContentDiv.appendChild(chatItemHeaderDiv)
          chatItemContentDiv.appendChild(chatItemLastMessageP)
      
          chatItemDiv.appendChild(avatarDiv)
          chatItemDiv.appendChild(chatItemContentDiv)
          chatItemDiv.addEventListener('click', () => {
            loadChatMessages(chatId)
            // Highlight selected chat item and remove highlight from others
            Array.from(chatListDiv.children).forEach((item) => item.classList.remove('active'))
            chatItemDiv.classList.add('active')
          })
          return chatItemDiv
        }
      
        // Load the list of chats for the current user
        chatListRef.on('value', (snapshot) => {
          chatListDiv.innerHTML = '' // Clear the chat list
          const chatIds = snapshot.val()
          if (chatIds) {
            Object.keys(chatIds).forEach((chatId) => {
              // Get the last message for each chat to display in the list
              const chatMessagesRef = messagesRef.child(chatId)
              chatMessagesRef
                .orderByChild('timestamp')
                .limitToLast(1)
                .on('child_added', (lastMessageSnapshot) => {
                  const lastMessage = lastMessageSnapshot.val()
                  const chatItem = createChatItem(chatId, lastMessage)
                  chatListDiv.appendChild(chatItem)
                  // Load the first chat's messages by default.
                  if (chatListDiv.firstChild) {
                    chatListDiv.firstChild.click()
                  }
                })
            })
          } else {
            chatMessagesDiv.innerHTML = '<p>No chats yet.</p>'
          }
        })
      })
    </script>
  </body>
</html>
