{% load i18n static app_locales %}

<div class="language-switcher">
  <div class="dropdown">
    <button class="dropdown-toggle" aria-expanded="false" aria-haspopup="true">
      <span class="current-language">
        <img src="{% static 'flags/'|add:current_locale.locale_flag|add:'.png' %}" alt="{{ current_locale.language_name }}" width="20" height="15" />
        {{ current_locale.language_name }}
      </span>
    </button>

    <ul class="dropdown-menu">
      {% for locale in locales %}
        {% if not locale.is_active %}
          <li>
            <a href="{% translate_url locale.language_code %}" lang="{{ locale.language_code }}" hreflang="{{ locale.language_code }}" class="language-option {% if locale.language_is_bidir %}rtl{% endif %}">
              <img src="{% static 'flags/'|add:locale.locale_flag|add:'.png' %}" alt="{{ locale.language_name }}" width="20" height="15" />
              {{ locale.native_name }}
            </a>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</div>

<style>
  .language-switcher {
    position: relative;
    display: inline-block;
  }
  
  .dropdown-toggle {
    background: none;
    border: 1px solid #ddd;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  
  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 1000;
    display: none;
    min-width: 160px;
    padding: 5px 0;
    margin: 2px 0 0;
    background-color: #fff;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 4px;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.175);
  }
  
  .dropdown:hover .dropdown-menu {
    display: block;
  }
  
  .language-option {
    display: block;
    padding: 8px 20px;
    clear: both;
    color: #333;
    text-decoration: none;
    white-space: nowrap;
  }
  
  .language-option:hover {
    background-color: #f5f5f5;
  }
  
  .language-option img {
    margin-right: 8px;
  }
  
  .rtl {
    direction: rtl;
    text-align: right;
  }
  
  .rtl img {
    margin-right: 0;
    margin-left: 8px;
  }
</style>
